<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - EZ Shots</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script>(function(){try{var t=localStorage.getItem("theme");if(!t){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <section class="page-head">
    <div class="container">
      <p class="eyebrow">Get in touch</p>
      <h1>Questions? Ask away.</h1>
    </div>
  </section>

  <section class="section">
    <div class="container contact-wrap">
      <div class="contact-info">
        <div style="background:var(--sand);border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px;margin-bottom:24px;">
          <b style="display:block;font-size:17px;color:var(--ink);margin-bottom:4px;">📅 Ready to book?</b>
          <p style="margin:0 0 16px;font-size:15px;">Choose a package to buy now or set up a time to talk.</p>
          <a href="packages.html" class="btn">See Packages</a>
        </div>
        <div class="contact-item">
          <div class="ic">✉️</div>
          <div><b>Email</b><span>bigmoneygelo2@gmail.com</span></div>
        </div>
        <div class="contact-item">
          <div class="ic">📍</div>
          <div><b>Service area</b><span>Serving Greater [Your City] &amp; surrounding areas</span></div>
        </div>
      </div>

      <form class="lead-form" novalidate>
        <div class="row2">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required placeholder="Jane Realtor" />
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" placeholder="(555) 123-4567" />
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="you@email.com" />
        </div>
        <div class="field">
          <label for="package">Package</label>
          <select id="package" name="package">
            <option>Essential - $199</option>
            <option selected>Premium - $349</option>
            <option>Not sure yet</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Property details</label>
          <textarea id="message" name="message" rows="4" required placeholder="Address, size, timeline..."></textarea>
        </div>
        <button type="submit" class="btn">Send Request</button>
        <p class="form-status" role="status" aria-live="polite"></p>
        <p class="form-note">New realtors: mention it's your first shoot for 50% off.</p>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/projects.js"></script>
  <script src="js/site.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/contact-form.js"></script>
</body>
</html>
