<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept or decline | EZ Shots</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>(function(){try{var t=localStorage.getItem("theme");if(!t){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="admin">
  <div id="site-header"></div>

  <section class="page-head" id="main">
    <div class="container narrow">
      <p class="eyebrow">Your booking</p>
      <h1 id="decide-title">Checking the link...</h1>
      <p class="lead" id="decide-lead"></p>
    </div>
  </section>

  <section class="section">
    <div class="container narrow">
      <!-- Filled by js/decide.js from /api/decide. Nothing on this page acts
           until a button is pressed; declining asks twice. -->
      <div class="book-summary" id="decide-summary" hidden></div>
      <p class="form-help decide-explain" id="decide-explain" hidden></p>
      <div class="btn-row decide-row" id="decide-step1" hidden>
        <button type="button" class="btn" id="decide-go">Continue</button>
      </div>
      <div class="decide-confirm" id="decide-step2" hidden>
        <p><b id="decide-sure">Are you sure?</b></p>
        <div class="btn-row">
          <button type="button" class="btn btn-danger" id="decide-yes">Yes</button>
          <button type="button" class="btn btn-ghost" id="decide-no">Keep the booking</button>
        </div>
      </div>
      <p class="form-status" id="decide-status" role="status" aria-live="polite"></p>
      <p class="form-help decide-foot"><a href="/admin">Open the bookings page</a></p>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/site.js"></script>
  <script src="js/decide.js"></script>
</body>
</html>
