<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings | EZ Shots Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script>(function(){try{var t=localStorage.getItem("theme");if(!t){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body class="adm" data-page="admin">
  <div id="adm-top"></div>

  <div id="adm-boot" class="adm-gate"><p class="adm-muted">Loading...</p></div>

  <div id="adm-off" class="adm-gate" hidden>
    <div class="adm-card">
      <h1>Admin is not switched on</h1>
      <p>This page needs the EZ Shots server running with an <code>ADMIN_PASSWORD</code> set, and a <code>DATABASE_URL</code> for the bookings. On Railway that is Variables on the ez-shots service.</p>
    </div>
  </div>

  <div id="adm-login" class="adm-gate" hidden>
    <form class="adm-card" id="adm-login-form">
      <h1>Sign in</h1>
      <p>One password, yours, from the Railway variables.</p>
      <label class="adm-field"><span>Password</span>
        <input class="adm-input" id="adm-password" type="password" autocomplete="current-password" required />
      </label>
      <p class="adm-error" id="adm-login-error" role="alert"></p>
      <button type="submit" class="adm-btn adm-btn-primary adm-btn-lg">Sign in</button>
    </form>
  </div>

  <main id="adm-app" class="adm-main" hidden>
    <div class="adm-wrap">
      <div class="adm-head">
        <div>
          <h1 id="greet">Bookings</h1>
          <p id="greet-sub"></p>
        </div>
        <div class="adm-head-actions">
          <span class="adm-updated" id="updated" aria-live="polite"></span>
          <button type="button" class="adm-icon" id="refresh-btn" title="Refresh" aria-label="Refresh"></button>
          <button type="button" class="adm-btn" id="export-btn"></button>
          <button type="button" class="adm-btn adm-btn-primary" id="add-btn"></button>
        </div>
      </div>

      <section id="next" aria-label="Next shoot"></section>
      <section class="adm-kpis" id="kpis" aria-label="Numbers"></section>

      <section class="adm-card" aria-label="Bookings">
        <div class="adm-toolbar">
          <div class="adm-seg" id="filters" role="group" aria-label="Show"></div>
          <div class="adm-search" id="search-wrap">
            <label class="adm-sr" for="search">Search bookings</label>
            <input class="adm-input" id="search" type="search" placeholder="Search address, client, email, phone, id" autocomplete="off" />
            <kbd>/</kbd>
          </div>
          <div class="adm-seg" id="views" role="group" aria-label="View"></div>
        </div>
        <div class="adm-toolbar" id="weeknav" hidden>
          <div class="adm-weeknav">
            <button type="button" class="adm-icon" id="week-prev" aria-label="Previous week"></button>
            <b id="week-label"></b>
            <button type="button" class="adm-icon" id="week-next" aria-label="Next week"></button>
          </div>
          <button type="button" class="adm-btn" id="week-today">This week</button>
        </div>
        <div id="list"></div>
        <div id="week" class="adm-week" hidden></div>
      </section>
    </div>
  </main>

  <div class="adm-scrim" id="scrim" hidden></div>
  <aside class="adm-drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

  <script src="js/site.js"></script>
  <script src="js/admin-core.js"></script>
  <script src="js/admin-bookings.js"></script>
</body>
</html>
