<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery | EZ Shots</title>
  <meta name="description" content="A gallery of real estate photography and drone aerials shot across Metro Detroit by EZ Shots." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>(function(){try{var t=localStorage.getItem("theme");if(!t){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="gallery">
  <div id="site-header"></div>

  <section class="page-head">
    <div class="container">
      <p class="eyebrow">Gallery</p>
      <h1>Frames from around the area</h1>
      <p class="lead">Interiors, exteriors and aerials pulled from recent Metro Detroit listings. Full shoots live on the <a href="portfolio.html" style="color:var(--brand);font-weight:700">portfolio page</a>.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="masonry" id="gallery-strip"></div>
    </div>
  </section>

  <section class="cta-band">
    <div class="container">
      <h2>Your listing could be next.</h2>
      <p>Photos and drone aerials from $150, half that on your first shoot.</p>
      <div class="btn-row center">
        <a href="packages.html" class="btn btn-lg btn-white">See pricing</a>
        <a href="contact.html" class="btn btn-lg btn-outline-white">Book a shoot</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/projects.js"></script>
  <script src="js/site.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
