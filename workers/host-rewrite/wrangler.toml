name = "hearth-host-rewrite"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Catch every request entering the zone, including tenant custom hostnames.
# A hostname-specific pattern would not match custom-hostname traffic — Worker
# routes are matched against the request URL, which is the tenant's domain.
[[routes]]
pattern = "*/*"
zone_name = "blueobsidian.xyz"

[vars]
RAILWAY_HOST = "hearth-production-1ce0.up.railway.app"
# Hosts that are the platform, not a tenant. Keep in sync with the
# PRIMARY_DOMAIN variable on the Railway service.
PLATFORM_HOSTS = "blueobsidian.xyz,www.blueobsidian.xyz,origin.blueobsidian.xyz"
