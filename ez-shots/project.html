<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — EZ Shots</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">EZ<span>Shots</span></a>
      <nav class="nav-links">
        <a href="index.html#work">Work</a>
        <a href="index.html#packages">Packages</a>
        <a href="index.html#contact">Contact</a>
        <a href="index.html#contact" class="btn">Book a Shoot</a>
      </nav>
    </div>
  </header>

  <section class="section detail-hero">
    <div class="container" id="detail"><!-- filled by JS --></div>
  </section>

  <section class="section section-soft" style="text-align:center">
    <div class="container">
      <h2>Like what you see?</h2>
      <p class="lead center">Let's make your next listing look this good.</p>
      <a href="index.html#contact" class="btn" style="margin-top:12px">Book a Shoot</a>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="brand">EZ<span style="color:#7fb2ff">Shots</span></div>
      <p>Real estate photography, video &amp; drone. &nbsp;|&nbsp; bigmoneygelo2@gmail.com &nbsp;|&nbsp; (555) 123-4567</p>
    </div>
  </footer>

  <script src="js/projects.js"></script>
  <script>
    (function () {
      function param(name) {
        return new URLSearchParams(window.location.search).get(name);
      }
      var id = param("id");
      var p = (window.EZ_PROJECTS || []).find(function (x) { return x.id === id; });
      var el = document.getElementById("detail");

      if (!p) {
        el.innerHTML = '<a class="back" href="index.html#work">← Back to portfolio</a>' +
          '<h2>Project not found</h2><p class="lead">That project doesn\'t exist. Head back to the portfolio to browse all shoots.</p>';
        return;
      }

      document.title = p.title + " — EZ Shots";
      var chips = (p.services || []).map(function (s) { return '<span class="chip">' + s + '</span>'; }).join("");
      var imgs = (p.gallery || []).map(function (src) {
        return '<img src="' + src + '" alt="' + p.title + '" loading="lazy">';
      }).join("");

      el.innerHTML =
        '<a class="back" href="index.html#work">← Back to portfolio</a>' +
        '<p class="eyebrow">' + p.type + '</p>' +
        '<h1>' + p.title + '</h1>' +
        '<p class="detail-meta">📍 ' + p.location + '</p>' +
        '<div class="chips">' + chips + '</div>' +
        '<p class="lead" style="margin-top:18px">' + p.description + '</p>' +
        '<div class="gallery">' + imgs + '</div>';
    })();
  </script>
</body>
</html>
